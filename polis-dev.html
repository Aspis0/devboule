<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polis — Dev Harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f0e6;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        color: #4a4742;
      }
      #polis-dev-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 8px 14px;
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid #ede8e3;
        backdrop-filter: blur(6px);
        font-size: 12px;
      }
      #polis-dev-bar strong {
        color: #2d2a26;
        font-size: 13px;
      }
      #polis-dev-status {
        color: #8a8580;
      }
      #polis-dev-info {
        margin-left: auto;
        color: #6b6661;
        font-family: "JetBrains Mono", monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 50vw;
      }
      #polis-dev-host {
        position: absolute;
        inset: 40px 0 0 0;
      }
    </style>
  </head>
  <body>
    <div id="polis-dev-bar">
      <strong>Polis · Dev Harness</strong>
      <span id="polis-dev-status">Booting…</span>
      <span id="polis-dev-info">Click a building to inspect it.</span>
    </div>
    <div id="polis-dev-host"></div>
    <script type="module" src="/polis-dev.tsx"></script>
  </body>
</html>
