[package]
name = "oracle-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "oracle_core"

[[bin]]
name = "oracle-cli"
path = "src/bin/oracle-cli.rs"

[[bin]]
name = "oracle-mcp"
path = "src/bin/oracle_mcp.rs"

[dependencies]
fastembed = { version = "5", features = ["qwen3"] }
candle-core = "0.10.2"
lancedb = "0.31"
arrow-array = "58.3"
arrow-schema = "58.3"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
blake2 = "0.10"
regex = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ndarray = "0.16"
tokenizers = "0.21"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
url = "2"
sysinfo = "0.33"
notify = "7"
sha2 = "0.10"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
http-body-util = "0.1"
# M4: pi-oracle MCP rail port. rmcp = official Rust MCP SDK; stdio server + macros.
rmcp = { version = "0.7", features = ["server", "transport-io", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Metal/CoreML are macOS-only — other targets must never see them.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "api-24", "coreml"] }
# sysctlbyname for kern.memorystatus_* pressure probes (no root required).
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# DirectML runs on any DX12 GPU (AMD/Intel/NVIDIA) with no CUDA toolkit, so it is
# the portable Windows GPU EP; it is Windows-only and must not leak to other targets.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "api-24", "directml"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
# Linux/other: CPU EP only (no GPU EP feature enabled).
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray"] }

[dev-dependencies]
tempfile = "3"
hyper = { version = "1", features = ["client"] }

[features]
default = []
metal = ["candle-core/metal", "fastembed/metal"]

[patch.crates-io]
# Patch esaxx-rs to use dynamic CRT (/MD) on Windows, matching ort-sys
# prebuilt binaries (rc.12). Without this, the linker fails with LNK2038:
# MT_StaticRelease vs MD_DynamicRelease.
esaxx-rs = { path = "../vendor/esaxx-rs-0.1.10" }
