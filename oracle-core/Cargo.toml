[package]
name = "oracle-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "oracle_core"

[[bin]]
name = "oracle-cli"
path = "src/bin/oracle-cli.rs"

[dependencies]
fastembed = { version = "5", features = ["qwen3"] }
candle-core = "0.10.2"
lancedb = "0.31"
arrow-array = "58.3"
arrow-schema = "58.3"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
blake2 = "0.10"
regex = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ndarray = "0.16"
tokenizers = "0.21"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
url = "2"
sysinfo = "0.33"

[target.'cfg(target_os = "macos")'.dependencies]
# Metal/CoreML are macOS-only — Windows builds must never see them.
ort = { version = "2.0.0-rc.10", features = ["coreml"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "2.0.0-rc.10" }

[dev-dependencies]
tempfile = "3"

[features]
default = []
metal = ["candle-core/metal", "fastembed/metal"]
