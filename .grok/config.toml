# Project MCP for Grok Build — single DEV UI-drive server for **Devboule**.
# Do not also put pilot in root .mcp.json (Grok would show a duplicate).
# App must be running: npm run devboule-pilot:app (FE :1420 + cargo --features ui-pilot).
# Refresh: /mcps → r

[mcp_servers.devboule_pilot]
command = "python3"
args = ["tools/devboule-pilot/mcp_proxy_for_grok.py"]
enabled = true
startup_timeout_sec = 30
env = { PATH = "/Users/user/.cargo/bin:/usr/local/bin:/usr/bin:/bin" }
