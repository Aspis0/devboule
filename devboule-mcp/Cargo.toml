[package]
name = "devboule-mcp"
version = "0.1.0"
edition = "2021"
description = "Devboule app-tools MCP server (Rust) — replaces oracle.server.aspis_mcp"
license = "Apache-2.0"

[lib]
name = "devboule_mcp"
path = "src/lib.rs"

[[bin]]
name = "devboule-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "io-std"] }
rmcp = { version = "0.7", features = ["server", "transport-io", "macros"] }
fs2 = "0.4"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"

[dev-dependencies]
tempfile = "3"
