[package]
name = "devboule-coder"
version = "0.1.0"
edition = "2021"
description = "Devboule local main-coder L2.1: conversational TUI shell driven by a MockModel."
license = "MIT"
publish = false

[[bin]]
name = "devboule-coder"
path = "src/main.rs"

# --- Dependency matrix (the main compatibility risk) -------------------------
# All TUI widget crates pin a specific `ratatui` generation, and the async
# `crossterm::event::EventStream` MUST be the SAME crossterm that `ratatui`
# re-exports, otherwise event types do not unify. The LATEST widget versions do
# NOT agree (tui-markdown 0.3.7 / throbber 0.11 moved to the ratatui 0.30 /
# ratatui-core line, while tui-textarea 0.7 is still on ratatui 0.29). We pin the
# whole tree to the ratatui 0.29 generation, the newest line where ALL THREE
# widgets agree:
#   ratatui 0.29.0           -> crossterm ^0.28.1 (re-exported)
#   tui-textarea 0.7.0       -> ratatui ^0.29 + crossterm ^0.28 (feature-selected)
#   tui-markdown 0.3.6       -> ratatui ^0.29 (0.3.7 jumped to ratatui-core 0.30)
#   throbber-widgets-tui 0.8 -> ratatui ^0.29 (0.9+ jumped to ratatui 0.30)
# We enable ratatui's default `crossterm` backend so ratatui owns the single
# crossterm 0.28.1 in the tree, add a DIRECT crossterm 0.28.1 with the
# `event-stream` feature (for the async EventStream), and select tui-textarea's
# matching `crossterm` feature. `cargo tree -d` is asserted clean (one ratatui,
# one crossterm) in verification.
[dependencies]
ratatui = "0.29.0"
crossterm = { version = "0.28.1", features = ["event-stream"] }
tui-textarea = { version = "0.7.0", default-features = false, features = ["ratatui", "crossterm"] }
# Pinned EXACTLY: 0.3.7 returns a `ratatui_core::text::Text` (the ratatui 0.30
# line) which does NOT unify with ratatui 0.29's `Text`. 0.3.6 is the newest
# tui-markdown that depends on ratatui 0.29 directly and returns its `Text`.
tui-markdown = "=0.3.6"
throbber-widgets-tui = "0.8.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
# L2.2 action protocol. All three already resolve transitively in the lockfile
# (regex via ratatui's deps, serde/serde_json via the widget tree), so declaring
# them directly reuses the SAME versions and introduces NO new crate and NO
# ratatui/crossterm duplicate. `cargo tree -d` is re-asserted clean in verification.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# L2.3 async seams. `async-trait` makes the `ToolExecutor` / `CoderModel` traits
# object-safe with `async fn` bodies, so the binary can keep holding `Arc<dyn …>`
# while the executor/model do real async I/O. Tiny proc-macro crate, no runtime
# weight; it already resolves transitively under tokio's tree so it adds no
# ratatui/crossterm duplicate.
async-trait = "0.1"
# L2.3 executor I/O. `rmcp` is the official MCP Rust SDK: a `client` + an
# `stdio`-style `transport-child-process` to spawn and talk to the Oracle MCP
# server, plus `macros`. `reqwest` (rustls, no native-tls / no OpenSSL) is the
# single HTTP client shared by BOTH the Exa web backend AND the loopback oMLX
# chat-completions model client — one HTTP stack, no `async-openai` (which would
# pull a second reqwest + backoff/derive tree for a single loopback call). The
# local FS backend uses `ignore` (the ripgrep walker: gitignore-aware, fast,
# skips `.git`/`target`/dotdirs for us) + `globset` for the `glob` action.
rmcp = { version = "1", default-features = false, features = ["client", "transport-child-process", "macros"] }
# `stream` enables `Response::bytes_stream` so HTTP bodies are read CAPPED (the
# Exa + loopback clients never buffer a gigabyte whole). It pulls only `tokio-util`
# codec glue already in the tree under tokio — no new ratatui/crossterm duplicate.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ignore = "0.4"
globset = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
# L2.3 FS-backend confinement tests build a real tempdir tree (confined read,
# `..`-escape rejection, planted grep match, glob listing, symlink-out non-traversal).
tempfile = "3"
